<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Você decide o futuro da IA</title>
</head>
<body>
    <div class="caixa-principal">
        <!-- Imagem de topo -->
        <img src="IMG/ESCOLA DO CAMPO_Image_1yn13j1yn13j1yn1.png" alt="Escola no campo" class="imagem-topo">

        <h1>Você decide o futuro da IA</h1>

        <!-- Pergunta -->
        <div class="caixa-perguntas">
            Você já sabe quais são as perguntas que irão nortear sua missão?
        </div>

        <!-- Alternativas -->
        <div class="caixa-alternativas">
            <button class="botao-sim">
                <img src="imagens/sim-icon.png" alt="Sim" class="icone-botao">
                Sim, eu já sei
            </button>
            <button class="botao-nao">
                <img src="imagens/nao-icon.png" alt="Não" class="icone-botao">
                Não, estou ajustando algumas coisas
            </button>
        </div>

        <!-- Resultado -->
        <div class="caixa-resultado">
            <p class="texto-resultado">
                Vamos testar?
            </p>
        </div>

        <!-- Imagem de rodapé -->
        <img src="imagens/campo-fundo.png" alt="Campo" class="imagem-rodape">
    </div>

    <script src="main.js"></script>
</body>
</html>
